name: Build unsigned macOS (arm64)
run-name: Build unsigned macOS (arm64) • ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v2026.6.0)"
        required: true
        default: "v2026.6.0"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout yaakapp/app
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Install Protoc for plugin-runtime
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: vp install
      - run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: "arm64"
      - run: npm run lint
      - name: Run JS Tests
        run: vp test
      - name: Run Rust Tests
        run: cargo test --all --exclude yaak-cli --features yaak-app-client/wry

      - name: Set version
        run: npm run replace-version
        env:
          YAAK_VERSION: ${{ inputs.version }}

      - name: Build
        run: npm run client:build -- --target aarch64-apple-darwin --bundles app,dmg --no-sign

      - name: Show bundle outputs
        run: |
          ls -la target/aarch64-apple-darwin/release/bundle || true
          find target/aarch64-apple-darwin/release/bundle -maxdepth 3 -print || true

      - uses: actions/upload-artifact@v4
        with:
          name: yaak-macos-arm64-unsigned-${{ inputs.version }}
          if-no-files-found: error
          path: |
            target/aarch64-apple-darwin/release/bundle/macos/*.app
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
